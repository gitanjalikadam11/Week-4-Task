<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default Parameter</title>
</head>
<body>
    <script>
    
    function greet(name = "Guest") {
        console.log(`Hello, ${name}!`);
    }
    greet("Gitanjali");
    greet();
    
    </script>

</body>
</html>
