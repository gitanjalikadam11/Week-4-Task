<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaining Promises</title>
</head>
<body>
    <script>
    
    Promise.resolve(10)
    .then((result) => {
        console.log(result);
        return result + 5;
    })
    .then((result) => {
        console.log(result);
        return result * 2;
    })
    .then((result) => {
        console.log(result);
    });

    </script>
    
</body>
</html>
