    <label>
        <input type="checkbox" name="skills" value="HTML"> HTML
    </label>
    <label>
        <input type="checkbox" name="skills" value="CSS"> CSS
    </label>
    <label>
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
    </label>
    
    <button id="showSkills">Show Selected Skills</button>
    <p id="result"></p>

    <script>
    document.getElementById("showSkills").addEventListener("click", function() {
        const checkboxes = document.querySelectorAll(
            'input[name="skills"]:checked'
        );
        const skills = Array.from(checkboxes).map(function(box) {
      return box.value;
    });

    document.getElementById("result").textContent =
      skills.length ? skills.join(", ") : "No skills selected";
    });
   </script>

   
</body>
