<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabbed content</title>

    <style>
    .tab {
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      background-color: #eeeeee;
    }

    .tab.active {
      background-color: blue;
      color: white;
    }

    .content {
      display: none;
      padding: 15px;
      border: 1px solid #cccccc;
    }

    .content.active {
      display: block;
    }
    </style>

</head>
<body>
    
    <h2>My Portfolio</h2>
    <button class="tab active" data-tab="about">About</button>
    <button class="tab" data-tab="skills">Skills</button>
    <button class="tab" data-tab="projects">Projects</button>
    <div id="about" class="content active">
        <h3>About Me</h3>
        <p>I am learning web development.</p>
    </div>

    <div id="skills" class="content">
    <h3>My Skills</h3>
    <p>HTML, CSS, JavaScript, Python and SQL.</p>
    </div>

    <div id="projects" class="content">
    <h3>My Projects</h3>
    <p>Restaurant website and portfolio website.</p>
    </div>
    
    <script>
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".content");

    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        // Remove active class from all tabs
        tabs.forEach(function(item) {
          item.classList.remove("active");
    });

        // Hide all content sections
    contents.forEach(function(content) {
    content.classList.remove("active");
    });

        // Activate the clicked tab
    tab.classList.add("active");

        // Show the matching content
    const targetId = tab.dataset.tab;
    document.getElementById(targetId).classList.add("active");
    });
    });
  </script>
    
</body>
</html>
