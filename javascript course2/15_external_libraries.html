<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Learning External Libraries</h1>
    <p id="message">Hello! I am learning JavaScript.</p>
    <button id="changeButton">Change Text</button>
    
    <!-- Load the external jQuery library first -->
     
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Our own JavaScript code -->
     
     <script>
     $("#changeButton").on("click", function () {
        $("#message").text("Great! I am using jQuery!");
    });
    </script>
    
</body>
</html>
