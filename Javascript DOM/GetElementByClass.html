<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetElementByClass</title>
</head>
<body>
    <p class="message">Hello</p>
    <p class="message">welcome</p>
    <p class="message">JavaScript</p>

    <script>
        let element=document.getElementsByClassName("message");
        console.log(element);
        console.log(element[0].textContent);

    </script>
</body>
</html>
