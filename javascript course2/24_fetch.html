<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fetch Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f4f4;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        .user {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Fetch API - User List</h1>

    <button id="loadBtn">Load Users</button>
    <p id="status"></p>
    <div id="users"></div>

    <script>
        const loadBtn = document.getElementById("loadBtn");
        const status = document.getElementById("status");
        const usersContainer = document.getElementById("users");

        async function loadUsers() {
            status.textContent = "Loading users...";
            usersContainer.replaceChildren();
            loadBtn.disabled = true;

            try {
                // Send a request to the public API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                // Check whether the HTTP request succeeded
                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }

                // Convert the response into JavaScript data
                const users = await response.json();

                // Display each user's details
                users.forEach(user => {
                    const card = document.createElement("div");
                    card.className = "user";

                    const name = document.createElement("h3");
                    name.textContent = user.name;

                    const email = document.createElement("p");
                    email.textContent = "Email: " + user.email;

                    const city = document.createElement("p");
                    city.textContent = "City: " + user.address.city;

                    card.append(name, email, city);
                    usersContainer.appendChild(card);
                });

                status.textContent = "Users loaded successfully!";

            } catch (error) {
                status.textContent = "Failed to load users: " + error.message;
            } finally {
                loadBtn.disabled = false;
            }
        }

        loadBtn.addEventListener("click", loadUsers);
    </script>

</body>
</html>
